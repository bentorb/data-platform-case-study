name: data_platform
version: "1.0.0"
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]

# Each model folder builds into the warehouse schema of the same name
# (see macros/generate_schema_name.sql).
models:
  data_platform:
    staging:
      +schema: staging
      +materialized: view
    # Tables: core is what analysts query, so reads should be fast and stable.
    # Every core model must declare its columns and types (a contract), and dbt
    # creates the table from that declaration rather than from the query.
    core:
      +schema: core
      +materialized: table
      +contract:
        enforced: true
