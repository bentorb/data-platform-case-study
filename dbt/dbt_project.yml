name: data_platform
version: "1.0.0"
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
# Set in the Airflow image, where packages are installed at build time; defaults to
# dbt's usual folder when dbt runs elsewhere.
packages-install-path: "{{ env_var('DBT_PACKAGES_PATH', 'dbt_packages') }}"

# Every model and test result is recorded in audit.dbt_run_results.
on-run-end:
  - "{{ log_run_results(results) }}"

# Each model folder builds into the warehouse schema of the same name
# (see macros/generate_schema_name.sql).
models:
  data_platform:
    staging:
      +schema: staging
      +materialized: view
      # Each staging model records the data-quality issues of its loads in audit.
      +post-hook: "{{ record_dq_issues(this) }}"
    # Tables, built and tested here, then published to live for consumers.
    # Every core model must declare its columns and types (a contract), and dbt
    # creates the table from that declaration rather than from the query.
    core:
      +schema: core
      +materialized: table
      +contract:
        enforced: true
      # A model with a retention (config.meta.retention) deletes its expired rows as
      # part of being built.
      +post-hook: "{{ expire_rows(this) }}"

# Each test's failing rows are saved as a table in audit, replaced on every run.
data_tests:
  data_platform:
    +store_failures: true
    +schema: audit
