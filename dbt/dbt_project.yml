name: data_platform
version: "1.0.0"
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
# Set in the Airflow image, where packages are installed at build time; defaults to
# dbt's usual folder when dbt runs elsewhere.
packages-install-path: "{{ env_var('DBT_PACKAGES_PATH', 'dbt_packages') }}"

# Each model folder builds into the warehouse schema of the same name
# (see macros/generate_schema_name.sql).
models:
  data_platform:
    staging:
      +schema: staging
      +materialized: view
    # Tables: core is what analysts query, so reads should be fast and stable.
    # Every core model must declare its columns and types (a contract), and dbt
    # creates the table from that declaration rather than from the query.
    core:
      +schema: core
      +materialized: table
      +contract:
        enforced: true
    # Data-quality history: each run appends what is new, earlier history is kept.
    # Counts only, no raw values, so data consumers may read it.
    audit:
      +schema: audit
      +materialized: incremental
      +on_schema_change: fail
      +contract:
        enforced: true
      +grants:
        select: ["analytics"]

# Each test's failing rows are saved as a table in audit, replaced on every run.
data_tests:
  data_platform:
    +store_failures: true
    +schema: audit
