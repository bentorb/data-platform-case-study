models:
  - name: dq_load_summary
    description: >
      Data-quality summary per load and staging model. Kept for every load, including
      loads whose rows were later replaced by a new delivery of the same file.
    constraints:
      - type: primary_key
        columns: [load_id, model]
    columns:
      - name: load_id
        description: The load's entry in audit.load_log.
        data_type: bigint
        constraints:
          - type: not_null
      - name: model
        description: Staging model measured.
        data_type: text
        constraints:
          - type: not_null
      - name: total_rows
        description: Rows of the load.
        data_type: bigint
        constraints:
          - type: not_null
      - name: rows_with_errors
        description: Rows with at least one dq_errors code, i.e. excluded from core.
        data_type: bigint
        constraints:
          - type: not_null
      - name: rows_with_warnings
        description: Rows with at least one dq_warnings code, i.e. repaired.
        data_type: bigint
        constraints:
          - type: not_null
      - name: error_rate
        description: rows_with_errors / total_rows, from 0 to 1.
        data_type: numeric(5,4)
        constraints:
          - type: not_null
      - name: measured_at
        description: When dbt computed the summary.
        data_type: timestamptz
        constraints:
          - type: not_null

  - name: dq_issue_counts
    description: >
      Rows affected by each data-quality issue code, per load and staging model.
    constraints:
      - type: primary_key
        columns: [load_id, model, kind, code]
    columns:
      - name: load_id
        description: The load's entry in audit.load_log.
        data_type: bigint
        constraints:
          - type: not_null
      - name: model
        description: Staging model measured.
        data_type: text
        constraints:
          - type: not_null
      - name: kind
        description: error (value unusable, row excluded from core) or warning (value repaired).
        data_type: text
        constraints:
          - type: not_null
      - name: code
        description: Issue code, e.g. price_invalid.
        data_type: text
        constraints:
          - type: not_null
      - name: affected_rows
        description: Rows with the issue.
        data_type: bigint
        constraints:
          - type: not_null
