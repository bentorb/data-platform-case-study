# Keys and not-null columns are enforced by the contract constraints, so they are
# not tested again; tests cover what constraints cannot.
models:
  - name: dim_products
    description: >
      Products sold, with the history of their names (SCD type 2): one row per version
      of a product, valid from valid_from (inclusive) to valid_to (exclusive).
    data_tests:
      # Each product's versions cover all dates, without gaps or overlaps.
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from
            upper_bound_column: valid_to
            partition_by: product_id
            gaps: not_allowed
    columns:
      - name: product_key
        description: Surrogate key of the version, from product_id and valid_from.
        data_type: text
        constraints:
          - type: primary_key
      - name: product_id
        description: Identifier of the product, shared by all its versions.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          # One current version per product.
          - unique:
              config:
                where: is_current
      - name: product_name
        description: Name of the product during the version.
        data_type: text
        constraints:
          - type: not_null
      - name: valid_from
        description: First day of the version; 1900-01-01 for a product's first version.
        data_type: date
        constraints:
          - type: not_null
      - name: valid_to
        description: Day after the version's last day; 9999-12-31 for the current version.
        data_type: date
        constraints:
          - type: not_null
      - name: is_current
        description: Whether this is the product's current version.
        data_type: boolean
        constraints:
          - type: not_null
      - name: last_seen_on
        description: Date of the latest transaction showing this version's name.
        data_type: date
        constraints:
          - type: not_null
      - name: _load_id
        description: The latest load of the product's transactions when the version was last written.
        data_type: bigint
        constraints:
          - type: not_null

  - name: fct_transactions
    description: >
      Customer transactions, one row per transaction. Only transactions that passed
      every staging check are included; rejected ones stay in
      stg_customer_transactions with their dq_errors. Built incrementally from the
      loads since the last run; a file delivered again replaces its earlier rows.
    columns:
      - name: transaction_id
        description: Identifier of the transaction.
        data_type: integer
        constraints:
          - type: primary_key
      - name: transaction_date
        description: Date of the transaction.
        data_type: date
        constraints:
          - type: not_null
      - name: customer_id
        description: Identifier of the customer.
        data_type: integer
        constraints:
          - type: not_null
      - name: product_id
        description: Identifier of the product sold.
        data_type: integer
        constraints:
          - type: not_null
      - name: product_key
        description: The product's version on the transaction's date; see dim_products.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: quantity
        description: Number of units.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: unit_price
        description: Price of one unit, before tax.
        data_type: numeric(12,2)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unit_tax
        description: Tax on one unit (assumed per unit; the source does not say).
        data_type: numeric(12,2)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: net_amount
        description: quantity × unit_price.
        data_type: numeric(14,2)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: tax_amount
        description: quantity × unit_tax.
        data_type: numeric(14,2)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: gross_amount
        description: net_amount + tax_amount.
        data_type: numeric(14,2)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _load_id
        description: The load's entry in audit.load_log.
        data_type: bigint
        constraints:
          - type: not_null
      - name: _source_file
        description: URI of the file the transaction was loaded from.
        data_type: text
        constraints:
          - type: not_null
      - name: _source_row
        description: Position of the transaction in the source file.
        data_type: bigint
        constraints:
          - type: not_null
