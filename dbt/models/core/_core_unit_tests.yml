# Unit tests: the models' logic on given input rows, run in CI and with
# `docker compose run --rm tests`, never in pipeline runs (see docs/testing.md).
# Columns left out of an input row are null; only the columns listed in `expect` are compared.
unit_tests:
  - name: fct_computes_amounts_and_keeps_valid_rows
    description: Amounts are per unit times quantity; rows with data-quality errors are left out.
    model: fct_transactions
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_customer_transactions')
        rows:
          - {transaction_id: 1, transaction_date: 2023-07-11, customer_id: 501, product_id: 101, quantity: 3,
             price: 10.50, tax: 1.05, dq_errors: "{}", _load_id: 1, _source_file: f.csv, _source_row: 1}
          - {transaction_id: 2, transaction_date: 2023-07-11, customer_id: null, product_id: 101, quantity: 1,
             price: 5.00, tax: 0.50, dq_errors: "{customer_id_missing}", _load_id: 1, _source_file: f.csv, _source_row: 2}
      - input: ref('dim_products')
        rows:
          - {product_key: k101, product_id: 101, valid_from: 1900-01-01, valid_to: 9999-12-31}
    expect:
      rows:
        - {transaction_id: 1, product_key: k101, unit_price: 10.50, unit_tax: 1.05,
           net_amount: 31.50, tax_amount: 3.15, gross_amount: 34.65}

  - name: fct_uses_the_product_version_of_the_transaction_date
    model: fct_transactions
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_customer_transactions')
        rows:
          - {transaction_id: 1, transaction_date: 2023-07-14, customer_id: 501, product_id: 101, quantity: 1,
             price: 1, tax: 0, dq_errors: "{}", _load_id: 1, _source_file: f.csv, _source_row: 1}
          - {transaction_id: 2, transaction_date: 2023-07-15, customer_id: 501, product_id: 101, quantity: 1,
             price: 1, tax: 0, dq_errors: "{}", _load_id: 1, _source_file: f.csv, _source_row: 2}
      - input: ref('dim_products')
        rows:
          - {product_key: old, product_id: 101, valid_from: 1900-01-01, valid_to: 2023-07-15}
          - {product_key: new, product_id: 101, valid_from: 2023-07-15, valid_to: 9999-12-31}
    expect:
      rows:
        - {transaction_id: 1, product_key: old}
        - {transaction_id: 2, product_key: new}

  - name: dim_versions_names_by_day
    description: >
      Full refresh: a new version each time a product's name changes, the first one valid
      from 1900-01-01 and the current one until 9999-12-31.
    model: dim_products
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_customer_transactions')
        rows:
          - {product_id: 101, product_name: A, transaction_date: 2023-07-10, _load_id: 1, _source_row: 1}
          - {product_id: 101, product_name: A, transaction_date: 2023-07-12, _load_id: 1, _source_row: 2}
          - {product_id: 101, product_name: A2, transaction_date: 2023-07-15, _load_id: 1, _source_row: 3}
          - {product_id: 101, product_name: A, transaction_date: 2023-07-17, _load_id: 1, _source_row: 4}
          - {product_id: 102, product_name: B, transaction_date: 2023-07-11, _load_id: 1, _source_row: 5}
          - {product_id: 102, product_name: null, transaction_date: 2023-07-12, _load_id: 1, _source_row: 6}
    expect:
      rows:
        - {product_id: 101, product_name: A, valid_from: 1900-01-01, valid_to: 2023-07-15, is_current: false, last_seen_on: 2023-07-12}
        - {product_id: 101, product_name: A2, valid_from: 2023-07-15, valid_to: 2023-07-17, is_current: false, last_seen_on: 2023-07-15}
        - {product_id: 101, product_name: A, valid_from: 2023-07-17, valid_to: 9999-12-31, is_current: true, last_seen_on: 2023-07-17}
        - {product_id: 102, product_name: B, valid_from: 1900-01-01, valid_to: 9999-12-31, is_current: true, last_seen_on: 2023-07-11}

  - name: dim_takes_the_last_name_delivered_on_a_day
    model: dim_products
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_customer_transactions')
        rows:
          - {product_id: 101, product_name: A, transaction_date: 2023-07-10, _load_id: 1, _source_row: 1}
          - {product_id: 101, product_name: A2, transaction_date: 2023-07-10, _load_id: 2, _source_row: 1}
    expect:
      rows:
        - {product_id: 101, product_name: A2, valid_from: 1900-01-01, is_current: true}

  - name: dim_applies_new_loads_to_current_versions
    description: >
      Incremental: a rename after the last day seen closes the current version; a new
      product gets its first version; a late name, dated before the last day seen, is not
      applied; a day already seen with the same name changes nothing.
    model: dim_products
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {product_key: a1, product_id: 101, product_name: A, valid_from: 1900-01-01, valid_to: 9999-12-31,
             is_current: true, last_seen_on: 2023-07-12, _load_id: 1}
          - {product_key: b1, product_id: 102, product_name: B, valid_from: 1900-01-01, valid_to: 9999-12-31,
             is_current: true, last_seen_on: 2023-07-15, _load_id: 1}
      - input: ref('stg_customer_transactions')
        rows:
          # load 1 is already in the dimension, so it is not read again
          - {product_id: 101, product_name: Z, transaction_date: 2023-07-11, _load_id: 1, _source_row: 1}
          - {product_id: 101, product_name: A2, transaction_date: 2023-07-14, _load_id: 2, _source_row: 1}
          - {product_id: 102, product_name: B-late, transaction_date: 2023-07-10, _load_id: 2, _source_row: 2}
          - {product_id: 102, product_name: B, transaction_date: 2023-07-15, _load_id: 2, _source_row: 3}
          - {product_id: 103, product_name: C, transaction_date: 2023-07-14, _load_id: 2, _source_row: 4}
    expect:
      rows:
        - {product_id: 101, product_name: A, valid_from: 1900-01-01, valid_to: 2023-07-14, is_current: false, last_seen_on: 2023-07-12, _load_id: 2}
        - {product_id: 101, product_name: A2, valid_from: 2023-07-14, valid_to: 9999-12-31, is_current: true, last_seen_on: 2023-07-14, _load_id: 2}
        - {product_id: 102, product_name: B, valid_from: 1900-01-01, valid_to: 9999-12-31, is_current: true, last_seen_on: 2023-07-15, _load_id: 2}
        - {product_id: 103, product_name: C, valid_from: 1900-01-01, valid_to: 9999-12-31, is_current: true, last_seen_on: 2023-07-14, _load_id: 2}
