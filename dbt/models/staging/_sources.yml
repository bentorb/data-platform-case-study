sources:
  - name: raw
    description: >
      Data exactly as loaded by ingestion. Source columns are text; ingestion adds
      the lineage columns (prefixed with _) to every table.
    schema: raw
    tables:
      - name: customer_transactions
        description: Customer transactions loaded from the landing zone.
        columns:
          - name: _source_file
            description: "{{ doc('_source_file') }}"
          - name: _source_row
            description: "{{ doc('_source_row') }}"
          - name: _loaded_at
            description: "{{ doc('_loaded_at') }}"
          - name: _load_id
            description: "{{ doc('_load_id') }}"
