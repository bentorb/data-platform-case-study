models:
  - name: stg_customer_transactions
    description: >
      Customer transactions from the raw layer, typed and cleaned. Every raw row is
      kept; values that cannot be used are null and listed in dq_errors.
    # Tests on the model's rows only check recently loaded ones (_loaded_at, raw's
    # partition key, so only recent partitions are read): older rows were tested when
    # they were loaded, and staging is a view, so a test of every row would parse all
    # of raw on every run. Seven days covers the loads of a pipeline that was blocked
    # for a few days. A transaction_id repeated across older files still fails the
    # fact's primary key.
    data_tests:
      # The newest load's error rate, from the data-quality history. Warns, not fails:
      # rejected rows make core incomplete, not wrong.
      - max_error_rate:
          name: stg_customer_transactions_error_rate_within_limit
          arguments:
            threshold: 0.1
          config:
            severity: warn
      # Volume: the newest load's rows within 50% of the median of the 14 loads before
      # it, once there are 7. Warns: an unusual volume is worth a look, not a stop.
      - volume_within_range:
          name: stg_customer_transactions_volume_within_range
          arguments:
            lookback: 14
            min_history: 7
            tolerance: 0.5
          config:
            severity: warn
      # Source freshness: staging keeps every row, rejected ones included, so this
      # tells whether the source still sends recent data. With the fact's own recency
      # test, a stale fact over a fresh staging means recent rows are being rejected.
      # Without any load in the last seven days, it warns too.
      - dbt_utils.recency:
          name: stg_customer_transactions_is_recent
          arguments:
            field: transaction_date
            datepart: day
            interval: 2
            ignore_time_component: true
          config:
            severity: warn
            where: &recent_loads "_loaded_at >= now() - interval '7 days'"
    columns:
      - name: transaction_id
        description: Identifier of the transaction. A 'T' prefix is removed.
        data_tests:
          - not_null:
              config:
                where: *recent_loads
          - unique:
              config:
                where: *recent_loads
      - name: customer_id
        description: Identifier of the customer.
      - name: transaction_date
        description: Date of the transaction, from YYYY-MM-DD or DD-MM-YYYY.
      - name: product_id
        description: Identifier of the product. A 'P' prefix is removed.
      - name: product_name
        description: Name of the product.
      - name: quantity
        description: Number of units.
      - name: price
        description: Unit price, as an exact decimal.
      - name: tax
        description: Tax amount, as an exact decimal.
      - name: dq_warnings
        description: >
          Codes of values repaired from a known alternative format, e.g.
          transaction_id_prefixed, transaction_date_dmy, product_id_prefixed.
        data_tests:
          - not_null:
              config:
                where: *recent_loads
      - name: dq_errors
        description: >
          Codes of values that are null because they were missing (<column>_missing)
          or could not be parsed (<column>_invalid).
        data_tests:
          - not_null:
              config:
                where: *recent_loads
      - name: _source_file
        description: "{{ doc('_source_file') }}"
        data_tests:
          - not_null:
              config:
                where: *recent_loads
      - name: _source_row
        description: "{{ doc('_source_row') }}"
        data_tests:
          - not_null:
              config:
                where: *recent_loads
      - name: _loaded_at
        description: "{{ doc('_loaded_at') }}"
        data_tests:
          - not_null:
              config:
                where: *recent_loads
      - name: _load_id
        description: "{{ doc('_load_id') }}"
        data_tests:
          - not_null:
              config:
                where: *recent_loads
