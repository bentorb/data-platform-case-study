models:
  - name: stg_customer_transactions
    description: >
      Customer transactions from the raw layer, typed and cleaned. Every raw row is
      kept; values that cannot be used are null and listed in dq_errors.
    data_tests:
      # Warns, not fails: rejected rows make core incomplete, not wrong.
      - max_error_rate:
          arguments:
            threshold: 0.1
          config:
            severity: warn
    columns:
      - name: transaction_id
        description: Identifier of the transaction. A 'T' prefix is removed.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Identifier of the customer.
      - name: transaction_date
        description: Date of the transaction, from YYYY-MM-DD or DD-MM-YYYY.
      - name: product_id
        description: Identifier of the product. A 'P' prefix is removed.
      - name: product_name
        description: Name of the product.
      - name: quantity
        description: Number of units.
      - name: price
        description: Unit price, as an exact decimal.
      - name: tax
        description: Tax amount, as an exact decimal.
      - name: dq_warnings
        description: >
          Codes of values repaired from a known alternative format, e.g.
          transaction_id_prefixed, transaction_date_dmy, product_id_prefixed.
        data_tests:
          - not_null
      - name: dq_errors
        description: >
          Codes of values that are null because they were missing (<column>_missing)
          or could not be parsed (<column>_invalid).
        data_tests:
          - not_null
      - name: _source_file
        description: "{{ doc('_source_file') }}"
        data_tests:
          - not_null
      - name: _source_row
        description: "{{ doc('_source_row') }}"
        data_tests:
          - not_null
      - name: _loaded_at
        description: "{{ doc('_loaded_at') }}"
        data_tests:
          - not_null
      - name: _load_id
        description: "{{ doc('_load_id') }}"
        data_tests:
          - not_null
