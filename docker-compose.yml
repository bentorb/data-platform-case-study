name: data-platform

# Settings shared by every Airflow service.
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    # The image installs the dbt packages listed in dbt/packages.yml, and includes the
    # framework code and pipeline configs.
    additional_contexts:
      dbt: ./dbt
      lib: ./lib
      pipelines: ./pipelines
  image: data-platform-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-nuyaCdXtmhX5e8oBl4FRin5xtSbZ0vJtI52gz3cNi0Q=}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-jwt-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Parse every file in the DAGs folder, not only those mentioning "airflow" and "dag":
    # pipeline DAG files only call lib/pipelines. The folder holds DAG files only, as
    # shared code lives in lib/ (when it shares the folder, list it in .airflowignore).
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    # Optional: task failures are posted to this webhook (lib/orchestration/callbacks.py).
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # Landing zone (S3-compatible) read by ingestion tasks (conn_id: landing_zone_s3).
    AIRFLOW_CONN_LANDING_ZONE_S3: >-
      {"conn_type": "aws",
       "login": "${LANDING_ZONE_ACCESS_KEY:-rustfsadmin}",
       "password": "${LANDING_ZONE_SECRET_KEY:-rustfsadmin}",
       "extra": {"endpoint_url": "http://landing-zone-storage:9000",
                 "region_name": "eu-south-2",
                 "config_kwargs": {"s3": {"addressing_style": "path"}}}}
    # Warehouse connection used by ingestion tasks (conn_id: warehouse_ingestion).
    AIRFLOW_CONN_WAREHOUSE_INGESTION: >-
      {"conn_type": "postgres",
       "host": "warehouse-db",
       "port": 5432,
       "schema": "${WAREHOUSE_DB_NAME:-warehouse}",
       "login": "ingestion_service",
       "password": "${WAREHOUSE_INGESTION_PASSWORD:-ingestion}"}
    # Location of the dbt project inside the containers.
    DBT_PROJECT_PATH: /opt/dbt
    # Warehouse connection used by dbt (read by dbt/profiles.yml).
    DBT_WAREHOUSE_HOST: warehouse-db
    DBT_WAREHOUSE_PORT: "5432"
    DBT_WAREHOUSE_DBNAME: ${WAREHOUSE_DB_NAME:-warehouse}
    DBT_WAREHOUSE_USER: transformation_service
    DBT_WAREHOUSE_PASSWORD: ${WAREHOUSE_TRANSFORMATION_PASSWORD:-transformation}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    # Local development: the working copies replace the image's, so changes apply
    # without rebuilding it.
    - ./lib:/opt/data-platform/lib:ro
    - ./pipelines:/opt/data-platform/pipelines:ro
    # Outside /opt/data-platform: everything there is importable via PYTHONPATH, and a
    # folder named dbt would shadow the dbt Python package.
    - ./dbt:/opt/dbt:ro
    - airflow_logs:/opt/airflow/logs
  restart: unless-stopped
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

# Settings shared by the landing zone's one-off jobs.
x-landing-zone-job: &landing-zone-job
  build: ./landing-zone
  image: data-platform-landing-jobs:local
  environment:
    LANDING_ZONE_ENDPOINT_URL: http://landing-zone-storage:9000
    LANDING_ZONE_ACCESS_KEY: ${LANDING_ZONE_ACCESS_KEY:-rustfsadmin}
    LANDING_ZONE_SECRET_KEY: ${LANDING_ZONE_SECRET_KEY:-rustfsadmin}
    LANDING_ZONE_BUCKET: landing
  restart: "no"

services:
  warehouse-db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-warehouse}
      WAREHOUSE_INGESTION_PASSWORD: ${WAREHOUSE_INGESTION_PASSWORD:-ingestion}
      WAREHOUSE_TRANSFORMATION_PASSWORD: ${WAREHOUSE_TRANSFORMATION_PASSWORD:-transformation}
      WAREHOUSE_ANALYTICS_PASSWORD: ${WAREHOUSE_ANALYTICS_PASSWORD:-analytics}
    ports:
      - "127.0.0.1:${WAREHOUSE_DB_PORT:-5432}:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql
      - ./warehouse-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # S3-compatible landing zone where source files are delivered.
  landing-zone-storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${LANDING_ZONE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${LANDING_ZONE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:${LANDING_ZONE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - landing_zone_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-off: creates the landing bucket.
  landing-zone-init:
    <<: *landing-zone-job
    command: ["/opt/landing-zone/init/01_create_bucket.py"]
    depends_on:
      landing-zone-storage:
        condition: service_healthy

  # One-off: simulates an upstream system delivering the files in data/.
  # Not part of the platform; in production the source system delivers the files.
  landing-zone-upload:
    <<: *landing-zone-job
    command: ["/opt/landing-zone/simulation/upload_files.py"]
    volumes:
      - ./data:/data:ro
    depends_on:
      landing-zone-init:
        condition: service_completed_successfully

  airflow-db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-off setup: the image entrypoint migrates the metadata DB and creates the
  # admin user before running the command (`airflow version`), then the container exits.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  warehouse_db_data:
  airflow_db_data:
  airflow_logs:
  landing_zone_data:
